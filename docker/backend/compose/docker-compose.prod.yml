services:
  # Production API with built app
  api:
    build:
      context: ../../../avanty-mail-be
      dockerfile: ../docker/backend/dockerfiles/Dockerfile
    container_name: avanty-mail-api-prod
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    env_file:
      - ../env/.env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - avanty-mail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3