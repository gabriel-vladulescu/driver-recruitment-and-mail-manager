services:
  # Development API with file watching
  api:
    build:
      context: ../../../avanty-mail-be
      dockerfile: ../docker/backend/dockerfiles/Dockerfile.dev
    container_name: avanty-mail-api-dev
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    env_file:
      - ../env/.env.development
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - ../../../avanty-mail-be:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - avanty-mail-network
    command: npm run dev