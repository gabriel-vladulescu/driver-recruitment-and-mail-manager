services:
  # Frontend Production with Nginx
  frontend:
    build:
      context: ../../../avanty-mail-fe
      dockerfile: ../docker/frontend/dockerfiles/Dockerfile
    container_name: avanty-mail-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - ../env/.env.production
    networks:
      - avanty-mail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  avanty-mail-network:
    external: true