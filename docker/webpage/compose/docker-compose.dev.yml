services:
  # Web Page Development with hot reload
  website:
    build:
      context: ../../../web-page
      dockerfile: ../docker/webpage/dockerfiles/Dockerfile.dev
    container_name: bolt-driver-website-dev
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT}:5173"
    volumes:
      - ../../../web-page:/app
      - /app/node_modules
    env_file:
      - ../env/.env.development
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - bolt-driver-network
    command: npm run dev -- --host 0.0.0.0

networks:
  bolt-driver-network:
    driver: bridge