services:
  # Web Page Production with Nginx
  website:
    build:
      context: ../../../web-page
      dockerfile: ../docker/webpage/dockerfiles/Dockerfile
    container_name: bolt-driver-website-prod
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT}:80"
    env_file:
      - ../env/.env.production
    networks:
      - bolt-driver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bolt-driver-network:
    driver: bridge