version: '3.8'

services:
  # Frontend Application
  frontend:
    build: .
    container_name: avanty-mail-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - avanty-mail-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  avanty-mail-network:
    external: true