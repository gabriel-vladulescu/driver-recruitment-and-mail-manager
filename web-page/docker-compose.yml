services:
  website:
    build: .
    container_name: bolt-driver-website
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - bolt-driver-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bolt-driver-network:
    driver: bridge