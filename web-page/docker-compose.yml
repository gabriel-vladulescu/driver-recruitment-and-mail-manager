services:
  # Web Page Development with hot reload
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webpage
    restart: unless-stopped
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - avanty-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "${APP_DOMAIN}:${APP_PORT}", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: npm run dev

networks:
  avanty-network:
    external: true # Uses existing network created by the backend