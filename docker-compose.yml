services:
  # MySQL Database for Avanty Mail
  avanty-mail-db:
    image: mysql:8.0
    container_name: avanty-mail-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AVANTY_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AVANTY_DB_NAME}
      MYSQL_USER: ${AVANTY_DB_USER}
      MYSQL_PASSWORD: ${AVANTY_DB_PASSWORD}
    ports:
      - "${AVANTY_DB_PORT}:${AVANTY_DB_PORT}"
    volumes:
      - avanty_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - bolt-driver-network

  # Avanty Mail Backend API
  avanty-mail-be:
    build: ./avanty-mail-be
    container_name: avanty-mail-api
    restart: unless-stopped
    ports:
      - "${AVANTY_MAIL_API_PORT}:${AVANTY_MAIL_API_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AVANTY_MAIL_API_PORT}
      DB_HOST: avanty-mail-db
      DB_PORT: ${AVANTY_DB_PORT}
      DB_NAME: ${AVANTY_DB_NAME}
      DB_USER: ${AVANTY_DB_USER}
      DB_PASSWORD: ${AVANTY_DB_PASSWORD}
      JWT_SECRET: ${AVANTY_JWT_SECRET}
      JWT_EXPIRES_IN: ${AVANTY_JWT_EXPIRES_IN}
      ADMIN_EMAIL: ${AVANTY_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${AVANTY_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${AVANTY_ALLOWED_ORIGINS}
      SMTP_HOST: ${AVANTY_SMTP_HOST}
      SMTP_PORT: ${AVANTY_SMTP_PORT}
      SMTP_SECURE: ${AVANTY_SMTP_SECURE}
      SMTP_USER: ${AVANTY_SMTP_USER}
      SMTP_PASSWORD: ${AVANTY_SMTP_PASSWORD}
      IMAP_HOST: ${AVANTY_IMAP_HOST}
      IMAP_PORT: ${AVANTY_IMAP_PORT}
      IMAP_SECURE: ${AVANTY_IMAP_SECURE}
      IMAP_USER: ${AVANTY_IMAP_USER}
      IMAP_PASSWORD: ${AVANTY_IMAP_PASSWORD}
    depends_on:
      avanty-mail-db:
        condition: service_healthy
    networks:
      - bolt-driver-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Avanty Mail Frontend
  avanty-mail-fe:
    build: ./avanty-mail-fe
    container_name: avanty-mail-frontend
    restart: unless-stopped
    ports:
      - "${AVANTY_MAIL_PORT}:80"
    environment:
      VITE_MAIL_API_BASE_URL: ${AVANTY_MAIL_API_BASE_URL}
    depends_on:
      - avanty-mail-be
    networks:
      - bolt-driver-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Bolt Driver Website
  bolt-driver-website:
    build: ./web-page
    container_name: bolt-driver-website
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-8080}:80"
    environment:
      MAIL_API_BASE_URL: ${AVANTY_MAIL_API_BASE_URL}
    networks:
      - bolt-driver-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  avanty_mysql_data:

networks:
  bolt-driver-network:
    driver: bridge